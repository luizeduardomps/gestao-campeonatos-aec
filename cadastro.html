<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | AEC Futebol 7</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg glass-nav sticky-top py-3">
      <div class="container">
        <a class="navbar-brand text-white" href="index.html">
          <strong class="fw-black">AEC</strong> FUTEBOL 7
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon" style="filter: invert(1)"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav gap-3">
            <li class="nav-item">
              <a class="nav-link text-white fw-bold" href="index.html">HOME</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-bold active" href="cadastro.html"
                >CADASTRO</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-bold" href="regulamento.html"
                >REGULAMENTO</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header
      class="hero-section text-white py-4"
      style="
        min-height: auto;
        border-radius: 0 0 1rem 1rem;
        margin-bottom: 2rem;
      "
    >
      <div class="container text-center">
        <h1 class="hero-title" style="font-size: clamp(2rem, 3vw, 3rem)">
          Gestão do Campeonato
        </h1>
        <p class="lead opacity-75">
          Inscrição oficial de atletas e agremiações AEC
        </p>
      </div>
    </header>

    <main class="container my-5" style="max-width: 800px">
      <div class="aec-card">
        <ul class="nav nav-tabs mb-4" id="cadastroTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active font-heading fw-bold"
              id="jogador-tab"
              data-bs-toggle="tab"
              data-bs-target="#jogador"
              type="button"
              role="tab"
              style="color: var(--aec-primary)"
            >
              NOVO JOGADOR
            </button>
          </li>
        </ul>

        <div class="tab-content" id="cadastroTabContent">
          <div class="tab-pane fade show active" id="jogador" role="tabpanel">
            <form
              id="formCadastro"
              class="p-4 bg-white rounded shadow-sm border"
              novalidate
            >
              <h4 class="aec-text-primary mb-4">Dados do Atleta</h4>

              <div class="row g-3">
                <div class="col-md-12">
                  <label for="nome" class="form-label fw-bold small"
                    >Nome Completo *</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="nome"
                    required
                    minlength="3"
                    placeholder="Digite seu nome completo"
                  />
                  <div class="invalid-feedback">
                    Por favor, insira um nome válido.
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label fw-bold small"
                    >E-mail *</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                    placeholder="atleta@email.com"
                  />
                  <div class="invalid-feedback">Insira um e-mail válido.</div>
                </div>

                <div class="col-md-6">
                  <label for="telefone" class="form-label fw-bold small"
                    >Telefone/WhatsApp *</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="telefone"
                    required
                    placeholder="(00) 00000-0000"
                  />
                </div>

                <div class="col-md-6">
                  <label for="cpf" class="form-label fw-bold small"
                    >CPF *</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="cpf"
                    required
                    placeholder="000.000.000-00"
                  />
                </div>

                <div class="col-md-6">
                  <label for="posicao" class="form-label fw-bold small"
                    >Posição Principal *</label
                  >
                  <select class="form-select" id="posicao" required>
                    <option value="" selected disabled>
                      Escolha sua posição...
                    </option>
                    <option value="goleiro">Goleiro</option>
                    <option value="zagueiro">Zagueiro</option>
                    <option value="meio-campo">Meio-Campo</option>
                    <option value="atacante">Atacante</option>
                  </select>
                </div>
              </div>

              <hr class="my-4" />
              <h4 class="aec-text-primary mb-4">
                Endereço (Integração ViaCEP)
              </h4>

              <div class="row g-3">
                <div class="col-md-4">
                  <label for="cep" class="form-label fw-bold small"
                    >CEP *</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="cep"
                    required
                    placeholder="00000-000"
                  />
                </div>

                <div class="col-md-8">
                  <label for="logradouro" class="form-label fw-bold small"
                    >Rua / Logradouro</label
                  >
                  <input
                    type="text"
                    class="form-control bg-light"
                    id="logradouro"
                    readonly
                  />
                </div>

                <div class="col-md-6">
                  <label for="bairro" class="form-label fw-bold small"
                    >Bairro</label
                  >
                  <input
                    type="text"
                    class="form-control bg-light"
                    id="bairro"
                    readonly
                  />
                </div>

                <div class="col-md-6">
                  <label for="cidade" class="form-label fw-bold small"
                    >Cidade</label
                  >
                  <input
                    type="text"
                    class="form-control bg-light"
                    id="cidade"
                    readonly
                  />
                </div>
              </div>

              <hr class="my-4" />

              <div class="mb-3">
                <label class="form-label fw-bold small d-block"
                  >Categoria Desejada *</label
                >
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="categoria"
                    id="catLivre"
                    value="livre"
                    required
                  />
                  <label class="form-check-label" for="catLivre"
                    >Série Livre</label
                  >
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="categoria"
                    id="catMaster"
                    value="master"
                  />
                  <label class="form-check-label" for="catMaster"
                    >Série Master (35+)</label
                  >
                </div>
              </div>

              <div class="mb-4">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="aceiteTermos"
                    required
                  />
                  <label
                    class="form-check-label text-muted small"
                    for="aceiteTermos"
                  >
                    Confirmo que li e aceito o
                    <a
                      href="regulamento.html"
                      class="aec-text-primary text-decoration-none fw-bold"
                      >Regulamento do Campeonato</a
                    >.
                  </label>
                </div>
              </div>

              <button type="submit" class="btn btn-aec-yellow w-100 py-3 fs-5">
                FINALIZAR CADASTRO
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="aec-footer py-4 mt-5 text-center text-white">
      <div class="container">
        <small
          >&copy; 2026 Associação Esportiva de Candói. Todos os direitos
          reservados.</small
        >
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery e jQuery Mask Plugin -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

    <!-- Script Principal -->
    <script src="assets/js/main.js"></script>
  </body>
</html>
